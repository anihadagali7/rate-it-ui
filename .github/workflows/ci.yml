name: CI

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # Skip the husky `prepare` hook — git hooks aren't needed on CI
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Only files changed in the PR: much of src/ predates the Prettier hook.
      - name: Check formatting of changed files
        if: github.event_name == 'pull_request'
        run: |
          git diff -z --name-only --diff-filter=ACMR "origin/${{ github.base_ref }}...HEAD" -- \
            'src/*.js' 'src/*.jsx' 'src/*.ts' 'src/*.tsx' 'src/*.json' 'src/*.css' 'src/*.scss' 'src/*.md' \
            | xargs -0 -r npx prettier --check

      - name: Run tests
        run: npm run test:ci

      - name: Production build
        run: npm run build
