name: CI

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      # Skip postinstall build — tests don't need a production bundle
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run tests
        # --forceExit: CRA does not process.exit() after Jest, so open handles
        # on CI can leave exit code 1 even when every test passed.
        run: npm run test:ci
        env:
          CI: true
          NODE_OPTIONS: --max_old_space_size=4096
